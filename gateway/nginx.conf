limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=30r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self';" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SSE Live Stream: Disable proxy buffering
    location ~ ^/api/v1/batches/[^/]+/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Upload chunks with rate limiting
    location /api/v1/uploads/ {
        limit_req zone=upload_limit burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Job download: pass X-Internal-Redirect so FastAPI can offload file transfer via X-Accel-Redirect
    location ~ ^/api/v1/jobs/[^/]+/download$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Redirect "1";
        proxy_read_timeout 300s;
    }

    # General API endpoints & Streaming-ZIP
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Internal Zero-Copy download location
    location /internal-buffer/ {
        internal;
        alias /buffer/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
